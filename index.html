<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard Sistema Nervoso</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#f4f6f9;
margin:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
}

h1{
margin-bottom:10px;
}

.viewer{
display:flex;
align-items:center;
justify-content:center;
width:100%;
max-width:900px;
}

.nav{
font-size:40px;
cursor:pointer;
padding:20px;
user-select:none;
}

.flashcard-container{
perspective:1000px;
width:80%;
max-width:600px;
height:500px;
}

.flashcard{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:transform 0.6s;
cursor:pointer;
}

.flashcard.flip{
transform:rotateY(180deg);
}

.side{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
background:white;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px;
}

.back{
transform:rotateY(180deg);
}

img{
max-width:100%;
max-height:250px;
margin-bottom:15px;
}

.question{
font-size:20px;
font-weight:bold;
text-align:center;
}

.answers{
display:flex;
flex-direction:column;
gap:10px;
width:100%;
margin-top:10px;
}

button.answer{
padding:10px;
border:none;
border-radius:6px;
background:#e3e7ee;
cursor:pointer;
font-size:16px;
}

button.answer.correct{
background:#4CAF50;
color:white;
}

button.answer.wrong{
background:#e74c3c;
color:white;
}

.controls{
margin-top:15px;
display:flex;
gap:10px;
}

.voice{
padding:8px 12px;
border:none;
border-radius:6px;
background:#3498db;
color:white;
cursor:pointer;
}

@media(max-width:700px){
.flashcard-container{
height:450px;
}
}

</style>
</head>

<body>

<h1>Flashcard Sistema Nervoso</h1>

<div class="viewer">

<div class="nav" onclick="prevCard()">&#60;</div>

<div class="flashcard-container">
<div class="flashcard" id="card">

<div class="side front">

<img id="img">

<div class="question" id="question"></div>

</div>

<div class="side back">

<div class="answers" id="answers"></div>

<div class="controls">
<button class="voice" onclick="speak()">🔊 Voce</button>
<button class="voice" onclick="stopSpeak()">⏹ Stop</button>
</div>

</div>

</div>
</div>

<div class="nav" onclick="nextCard()">&#62;</div>

</div>

<script>

const cards = [

{
img:"1 CERVELLO.jpg",
q:"Quale organo è mostrato nell’immagine?",
answers:["Cuore","Cervello","Polmone","Fegato"],
correct:1
},

{
img:"2 CERVELLO.jpg",
q:"Qual è la funzione principale dell’organo mostrato?",
answers:[
"Pompare il sangue",
"Controllare e coordinare le attività del corpo",
"Digerire il cibo",
"Produrre ossigeno"],
correct:1
},

{
img:"3 NEURONE.png",
q:"Come si chiama la cellula rappresentata?",
answers:[
"Globulo rosso",
"Cellula muscolare",
"Neurone",
"Cellula ossea"],
correct:2
},

{
img:"4 MIDOLLO SPINALE.jpg",
q:"Quale struttura è indicata nell’immagine?",
answers:[
"Midollo spinale",
"Intestino",
"Cuore",
"Polmone"],
correct:0
},

{
img:"5 SISTEMA NERVOSO.png",
q:"Che cosa mostra questa immagine?",
answers:[
"Sistema nervoso",
"Sistema digestivo",
"Sistema respiratorio",
"Sistema scheletrico"],
correct:0
},

{
img:"6 CERVELLETTO.jpg",
q:"Quale parte del cervello controlla equilibrio e coordinazione?",
answers:[
"Cervelletto",
"Midollo spinale",
"Cuore",
"Polmone"],
correct:0
},

{
img:"7 ARCO RIFLESSO.jpg",
q:"Che cosa rappresenta la situazione mostrata?",
answers:[
"Digestione",
"Arco riflesso",
"Respirazione",
"Circolazione"],
correct:1
},

{
img:"8 PERCORSO STIMOLO-RISPOSTA.jpg",
q:"Che cosa rappresenta lo schema?",
answers:[
"Percorso dell’aria",
"Percorso del sangue",
"Percorso dello stimolo e della risposta",
"Percorso del cibo"],
correct:2
},

{
img:"9 SISTEMA NERVOSO PERIFERICO.png",
q:"A quale parte del sistema nervoso appartengono i nervi mostrati in blu?",
answers:[
"Sistema nervoso periferico",
"Sistema nervoso centrale",
"Sistema respiratorio",
"Sistema digestivo"],
correct:0
},

{
img:"10 ORGANI DI SENSO.jpg",
q:"Che cosa mostrano le strutture nell’immagine?",
answers:[
"Gli organi del sistema digestivo",
"Gli organi di senso",
"I muscoli del corpo",
"Le ossa del corpo"],
correct:1
},

{
img:"11 SISTEMA NERVOSO CENTRALE.jpg",
q:"Quale parte del sistema nervoso è mostrata?",
answers:[
"Sistema nervoso periferico",
"Sistema nervoso centrale",
"Sistema digestivo",
"Sistema respiratorio"],
correct:1
},

{
img:"12 NERVI E MUSCOLI.jpg",
q:"Che cosa mostrano i nervi collegati ai muscoli?",
answers:[
"Il movimento del sangue",
"La risposta motoria del corpo",
"Il processo digestivo",
"Il sistema respiratorio"],
correct:1
},

{
img:"13 ASSONE.png",
q:"Come si chiama la parte del neurone cerchiata?",
answers:[
"Assone",
"Corpo cellulare",
"Sinapsi",
"Midollo"],
correct:0
},

{
img:"14 SINAPSI CERCHIATA.jpg",
q:"Che cosa rappresenta la struttura all’estremità dell’assone?",
answers:[
"Sinapsi",
"Guaina mielinica",
"Midollo spinale",
"Cervello"],
correct:0
},

{
img:"15 CORPO CELLULARE CERCHIATO.png",
q:"Come si chiama la parte del neurone che contiene il nucleo?",
answers:[
"Assone",
"Corpo cellulare",
"Sinapsi",
"Midollo"],
correct:1
},

{
img:"16 NEURONE SENSORIALE.png",
q:"Qual è il ruolo del neurone sensoriale?",
answers:[
"Porta informazioni dagli organi di senso al cervello",
"Fa muovere i muscoli",
"Produce sangue",
"Trasporta ossigeno"],
correct:0
}

]

let index=0

function loadCard(){

const c=cards[index]

document.getElementById("img").src=c.img
document.getElementById("question").innerText=c.q

const answersDiv=document.getElementById("answers")
answersDiv.innerHTML=""

c.answers.forEach((a,i)=>{

const btn=document.createElement("button")
btn.className="answer"
btn.innerText=a

btn.onclick=(e)=>{

if(i===c.correct){
btn.classList.add("correct")
}else{
btn.classList.add("wrong")
answersDiv.children[c.correct].classList.add("correct")
}

}

answersDiv.appendChild(btn)

})

document.getElementById("card").classList.remove("flip")

}

document.getElementById("card").onclick=()=>{
document.getElementById("card").classList.toggle("flip")
}

function nextCard(){
index=(index+1)%cards.length
loadCard()
}

function prevCard(){
index=(index-1+cards.length)%cards.length
loadCard()
}

function speak(){

stopSpeak()

const text=cards[index].q

const utter=new SpeechSynthesisUtterance(text)

utter.lang="it-IT"

speechSynthesis.speak(utter)

}

function stopSpeak(){
speechSynthesis.cancel()
}

loadCard()

</script>

</body>
</html>
